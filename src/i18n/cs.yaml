modal:
  problem-leads:
    kicker: Co to řeší
    title: Málo poptávek z webu
    lead: Web může být technicky v pořádku a přesto nepřesvědčuje. SIGEL hledá místa, kde se návštěvník ztratí, nezíská důvěru nebo nepochopí další krok.
    items:
    - - Kdy dává smysl
      - Když web má návštěvnost, ale málo poptávek, objednávek nebo jasných akcí.
    - - Co se kontroluje
      - Jasnost nabídky, CTA, důvěryhodnost, mobilní cesta a komunikační bariéry.
    - - Typický výstup
      - Prioritní doporučení, která oddělí kosmetiku od míst s reálným dopadem.
    cta: Získat Web Intelligence report za 4 980 Kč
  problem-marketing:
    kicker: Co to řeší
    title: Marketing běží, výsledky slabé
    lead: Než se navýší rozpočet, je potřeba zjistit, jestli cílová stránka dokáže návštěvníka vůbec přivést k rozhodnutí.
    items:
    - - Kdy dává smysl
      - Před reklamou, při slabé konverzi nebo když kampaně posílají lidi na web bez výsledku.
    - - Co se kontroluje
      - Landing sekce, rychlost, CTA, důkazy, důvěra a rozpor mezi reklamou a webem.
    - - Typický výstup
      - Seznam bariér, které mohou brzdit výkon ještě před samotnou reklamou.
    cta: Prověřit web před reklamou
  problem-redesign:
    kicker: Co to řeší
    title: Redesign bez jasného zadání
    lead: Redesign bez diagnostiky často jen vymění vzhled. SIGEL pomůže určit, co má nový web skutečně opravit.
    items:
    - - Kdy dává smysl
      - Před redesignem, briefem pro agenturu nebo rozhodnutím, co na webu měnit.
    - - Co se kontroluje
      - Struktura, komunikace nabídky, důvěra, UX, archetyp značky a rozhodovací cesta.
    - - Typický výstup
      - Podklad pro redesign, který řeší funkci webu, ne jen dekoraci.
    cta: Získat podklad pro redesign
  problem-offer:
    kicker: Co to řeší
    title: Nabídka je dobrá, lidé ji nechápou
    lead: Někdy problém není produkt, ale způsob, jakým je vysvětlený. SIGEL hledá rozdíl mezi tím, co firma nabízí, a tím, co návštěvník opravdu pochopí.
    items:
    - - Kdy dává smysl
      - Když zákazníci nerozumí hodnotě, ceně, rozdílu proti konkurenci nebo důvodu pokračovat.
    - - Co se kontroluje
      - Jazyk nabídky, důkazy, archetyp značky a zákaznické motivace.
    - - Typický výstup
      - Doporučení, jak nabídku zpřesnit pro různé typy zákazníků.
    cta: Zpřesnit komunikaci webu
  problem-strategy:
    kicker: Co to řeší
    title: Web už neodpovídá firmě
    lead: Web často zůstane v minulosti, i když se firma posunula. SIGEL ověří, jestli komunikace, nabídka a cílové skupiny ještě odpovídají realitě byznysu.
    items:
    - - Kdy dává smysl
      - Při stagnaci, změně nabídky, nové cílovce nebo před zásadnějším obchodním rozhodnutím.
    - - Co se kontroluje
      - Soulad nabídky, positioning, archetyp, zákaznické segmenty a prioritní rizika.
    - - Typický výstup
      - Roadmapa toho, co změnit první, aby web znovu podporoval směr firmy.
    cta: Prověřit strategii webu
  problem-agency:
    kicker: Co to řeší
    title: Rychlý podklad pro rozhodnutí
    lead: Majitel, marketingový tým ani agentura nemusí začínat od dojmů. SIGEL dodá externí diagnostiku jako vstup do konzultace, redesignu, kampaně nebo strategie.
    items:
    - - Kdy dává smysl
      - Před konzultací, návrhem úprav, kampaní, redesignem nebo rozhodnutím o dalším rozpočtu.
    - - Co se kontroluje
      - Technika, UX, komunikace, důvěra, archetypy a priority v jednom podkladu.
    - - Typický výstup
      - Rychlý report použitelný jako interní rozhodovací nebo klientský podklad.
    cta: Domluvit pilotní spolupráci
    inquiry: agency
  system-process:
    kicker: Analytické jádro
    title: Jak SIGEL skládá Web Intelligence výstup
    lead: SIGEL Web Intelligence není čistý AI text ani běžný checklist. Je to analytický systém, který sbírá signály z webu, vyhodnocuje je pomocí vlastního scoringu, pravidel, vah a UX heuristik a převádí
      je do obchodně použitelného reportu.
    items:
    - - Sběr signálů
      - Technika, SEO, struktura, obsah, CTA, důvěra a komunikace nabídky.
    - - Vlastní analytická logika
      - Systém pracuje s pravidly, váhami, prioritami a scoringem, aby bylo jasné, co má reálný dopad.
    - - UX a komunikační heuristiky
      - Systém sleduje, kde návštěvník chápe nabídku, kde váhá a kde může ztrácet důvěru.
    - - Interpretační vrstva
      - Nad daty vzniká interpretace značky, zákaznických archetypů a komunikace k různým typům zákazníků.
    - - Ruční kontrola výstupu
      - Každý report před odesláním prochází osobní kontrolou, aby měl jasné priority a praktický smysl.
    cta: Získat Web Intelligence report za 4 980 Kč
  use-web-audit:
    kicker: Dostupné
    title: Web Intelligence Report
    lead: 'Základní produkt SIGELu: business intelligence pro jeden konkrétní web před reklamou, redesignem nebo obchodním rozhodnutím.'
    items:
    - - Obsahuje
      - Desktopové a mobilní Lighthouse metriky, Core Web Vitals, odkazy a CTA, přístupnost, komunikaci nabídky, AI připravenost, archetypový playbook, roadmapu a evidence data.
    - - Hodí se pro
      - Firmy, freelancery, menší týmy nebo projekty, které potřebují jasný diagnostický vstup.
    - - Výstup
      - Vizuální PDF report s prioritami a doporučeními.
    cta: Získat Web Intelligence report
  use-agency:
    kicker: Pilotně
    title: Agenturní podklad
    lead: 'Stejný diagnostický základ, ale balený pro agenturní použití: klientská konzultace, redesign, SEO nebo obsahová strategie.'
    items:
    - - Obsahuje
      - Externí pohled na klientský web, priority a podklad pro doporučení.
    - - Hodí se pro
      - Agentury, které chtějí rychlejší vstup bez kompletní ruční diagnostiky od nuly.
    - - Výstup
      - Report nebo interní podklad podle dohody.
    cta: Domluvit pilotní spolupráci
    inquiry: agency
  use-lead-research:
    kicker: Pilotně
    title: Lead Research
    lead: 'Výzkumná vrstva: hledání relevantních firemních webů a veřejných kontaktů v segmentu, lokalitě nebo vlastním výběru trhu.'
    items:
    - - Obsahuje
      - Sběr URL, filtrování, základní validaci a přípravu kontaktů pro B2B výzkum.
    - - Hodí se pro
      - Obchodní přípravu, segmentaci trhu, seznam potenciálních klientů nebo navazující analýzu.
    - - Výstup
      - Strukturovaný seznam webů a kontaktů podle zadání.
    cta: Probrat výběr segmentu
    inquiry: lead-research
  use-benchmark:
    kicker: Připravujeme
    title: Segmentový benchmark
    lead: Porovnání více webů v jednom odvětví, lokalitě nebo tržním výběru. Tohle je navazující vrstva nad jednotlivými reporty.
    items:
    - - Obsahuje
      - Srovnání skóre, opakující se vzorce, rozdíly mezi hráči a segmentové signály.
    - - Hodí se pro
      - Tržní přehled, interní rozhodování, obchodní výběr nebo přípravu strategie.
    - - Výstup
      - Benchmarková mapa a souhrn hlavních zjištění.
    cta: Zeptat se na benchmark
    inquiry: benchmark
