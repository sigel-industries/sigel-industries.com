  - - Wir messen
    - - - Technik und Performance
        - 'Lighthouse für Desktop und Mobil, Core Web Vitals: LCP, FCP, CLS, TBT, Speed Index, TTI.'
      - - Sicherheitssignale
        - HTTPS und Weiterleitungen, TLS-Zertifikat, HTTP-Security-Header. Passive Prüfung.
      - - Links und CTAs
        - Defekte und blockierte Links, Calls-to-Action und verdächtige Elemente.
      - - Barrierefreiheit
        - Kontrast, Schriftgröße und Touch-Ziele mit den konkreten Elementen auf Desktop und Mobil.
      - - KI-Bereitschaft
        - Strukturierte Daten und Signale für KI-Suche.
  - - Wir bewerten
    - - - Gesamtbild
        - Scores in sechs Bereichen und eine Zusammenfassung von Stärken und Risiken.
      - - UX und Angebotskommunikation
        - Klarheit, Konsistenz und Konkretheit der Botschaft, Navigation und Wirkung auf die Conversion.
      - - Archetyp von Marke und Zielgruppe
        - Archetypen-Karte, Brand- und Customer-Playbook, Regeln für die Tonalität.
  - - Sie entscheiden
    - - - Management Summary
        - Kurzer Entscheidungsüberblick und geschäftliche Wirkung für die Geschäftsführung.
      - - Priorisierte Roadmap
        - Was zuerst, Quick Wins, Wirkung × Aufwand.
      - - Evidenz-Anhang
        - Crawl, Robots, Sitemap, Metadaten und Messdaten.
