modal:
  problem-leads:
    kicker: Was es löst
    title: Zu wenige Anfragen über die Website
    lead: Eine Website kann technisch sauber sein und trotzdem nicht überzeugen. SIGEL sucht Stellen, an denen Besucher Klarheit, Vertrauen oder den nächsten Schritt verlieren.
    items:
    - - Wann es hilft
      - Wenn die Website Traffic hat, aber wenige Anfragen, Bestellungen oder sinnvolle Aktionen erzeugt.
    - - Was geprüft wird
      - Angebotsklarheit, CTA, Vertrauen, mobiler Weg und Kommunikationsbarrieren.
    - - Typischer Output
      - Prioritäten, die Kosmetik von Punkten mit echter Wirkung trennen.
    cta: Web-Intelligence-Report für 199 € bestellen
  problem-marketing:
    kicker: Was es löst
    title: Marketing läuft, die Ergebnisse bleiben schwach
    lead: Bevor das Werbebudget steigt, sollte geprüft werden, ob die Landingpage eine Entscheidung überhaupt unterstützt.
    items:
    - - Wann es hilft
      - Vor Werbung, bei schwacher Conversion oder wenn Kampagnen Traffic ohne Ergebnis bringen.
    - - Was geprüft wird
      - Landingpages, Geschwindigkeit, CTA, Belege, Vertrauen und Abweichungen zwischen Werbung und Website.
    - - Typischer Output
      - Eine Liste von Barrieren, die die Leistung schon vor der Kampagne blockieren können.
    cta: Website vor der Kampagne prüfen
  problem-redesign:
    kicker: Was es löst
    title: Redesign ohne klares Briefing
    lead: Ein Redesign ohne Diagnostik verändert oft nur die Optik. SIGEL definiert, was die neue Website tatsächlich beheben soll.
    items:
    - - Wann es hilft
      - Vor einem Redesign, einem Agenturbriefing oder der Entscheidung, was geändert werden soll.
    - - Was geprüft wird
      - Struktur, Angebotskommunikation, Vertrauen, UX, Markenarchetyp und Entscheidungsweg.
    - - Typischer Output
      - Eine Redesign-Grundlage mit Fokus auf Funktion statt Dekoration.
    cta: Grundlage für das Redesign erhalten
  problem-offer:
    kicker: Was es löst
    title: Das Angebot ist gut, wird aber nicht verstanden
    lead: Manchmal ist nicht das Produkt das Problem, sondern die Erklärung seines Werts.
    items:
    - - Wann es hilft
      - Wenn Kunden Wert, Preis, Unterschied oder den Grund für den nächsten Schritt nicht verstehen.
    - - Was geprüft wird
      - Angebotssprache, Belege, Markenarchetyp und Kundenmotive.
    - - Typischer Output
      - Empfehlungen zur Präzisierung des Angebots für unterschiedliche Kundentypen.
    cta: Website-Kommunikation präzisieren
  problem-strategy:
    kicker: Was es löst
    title: Die Website passt nicht mehr zum Unternehmen
    lead: Websites bleiben oft auf altem Stand, während sich das Unternehmen weiterentwickelt. SIGEL prüft, ob Kommunikation, Angebot und Zielgruppen noch zur Geschäftsrichtung passen.
    items:
    - - Wann es hilft
      - Bei Stagnation, verändertem Angebot, neuer Zielgruppe oder vor einer strategischen Entscheidung.
    - - Was geprüft wird
      - Angebotspassung, Positionierung, Archetyp, Kundensegmente und vorrangige Risiken.
    - - Typischer Output
      - Eine Roadmap dessen, was zuerst geändert werden sollte.
    cta: Website-Strategie prüfen
  problem-agency:
    kicker: Was es löst
    title: Schnelle Grundlage für eine Entscheidung
    lead: Inhaber, Marketingteams und Agenturen müssen nicht mit Meinungen beginnen. SIGEL liefert externe Diagnostik als Input für Beratung, Redesign, Kampagnen oder Strategie.
    items:
    - - Wann es hilft
      - Vor Beratung, Empfehlungen, Kampagnen, Redesign oder der nächsten Budgetentscheidung.
    - - Was geprüft wird
      - Technik, UX, Kommunikation, Vertrauen, Archetypen und Prioritäten in einem Input.
    - - Typischer Output
      - Ein schneller Report als interne Entscheidungsgrundlage oder Kunden-Input.
    cta: Konditionen der Zusammenarbeit besprechen
    inquiry: agency
  system-process:
    kicker: Analytischer Kern
    title: So erstellt SIGEL den Web-Intelligence-Output
    lead: SIGEL Web Intelligence ist weder reiner KI-Text noch eine generische Checkliste. Das Analysesystem sammelt Website-Signale, bewertet sie mit eigenem Scoring, Regeln, Gewichtungen und UX-Heuristiken
      und übersetzt sie in einen geschäftlich nutzbaren Report.
    items:
    - - Signalerfassung
      - Technik, SEO, Struktur, Inhalt, CTA, Vertrauen und Angebotskommunikation.
    - - Eigene Analyselogik
      - Regeln, Gewichtungen, Prioritäten und Scoring machen sichtbar, was echte Wirkung hat.
    - - UX- und Kommunikationsheuristiken
      - Das System prüft, wo Besucher das Angebot verstehen, zögern, Vertrauen verlieren oder den nächsten Schritt nicht finden.
    - - Interpretationsschicht
      - Daten werden über Marke, Kundenarchetypen und Kommunikationsmuster interpretiert.
    - - Persönliche Prüfung
      - Jeder Report wird vor der Lieferung geprüft, damit Prioritäten klar und praktisch nutzbar sind.
    cta: Web-Intelligence-Report für 199 € bestellen
  use-web-audit:
    kicker: Verfügbar
    title: Web-Intelligence-Report
    lead: 'Das Kernprodukt von SIGEL: Business Intelligence für eine konkrete Website vor Werbung, Redesign oder einer Geschäftsentscheidung.'
    items:
    - - Enthält
      - Lighthouse-Metriken für Desktop und Mobilgeräte, Core Web Vitals, Links und CTAs, Barrierefreiheit, Angebotskommunikation, KI-Bereitschaft, Archetypen-Playbook, Roadmap und Evidenzdaten.
    - - Geeignet für
      - Unternehmen, Freelancer, kleine Teams oder Projekte, die einen klaren diagnostischen Input benötigen.
    - - Output
      - Visueller PDF-Report mit Prioritäten und Empfehlungen.
    cta: Web-Intelligence-Report bestellen
  use-agency:
    kicker: Verfügbar
    title: Agentur-Input
    lead: 'Derselbe Web-Intelligence-Report für die Websites Ihrer Kunden: Kundenberatung, Redesign, SEO oder Content-Strategie.'
    items:
    - - Enthält
      - Externe Sicht auf die Kundenwebsite, Prioritäten und Input für Empfehlungen.
    - - Geeignet für
      - Agenturen, die einen schnelleren Startpunkt benötigen, ohne die Diagnostik manuell bei null zu beginnen.
    - - Output
      - Report oder interner Input nach Absprache.
    cta: Konditionen der Zusammenarbeit besprechen
    inquiry: agency
  use-lead-research:
    kicker: Pilot
    title: Lead Research
    lead: Eine Research-Ebene zur Suche relevanter Unternehmenswebsites und öffentlicher Kontakte nach Segment, Region oder individueller Marktauswahl.
    items:
    - - Enthält
      - URL-Sammlung, Filterung, grundlegende Validierung und Kontaktvorbereitung für B2B-Research.
    - - Geeignet für
      - Vertriebsvorbereitung, Marktsegmentierung, Interessentenlisten oder Folgeanalysen.
    - - Output
      - Strukturierte Liste von Websites und Kontakten nach Briefing.
    cta: Segmentauswahl besprechen
    inquiry: lead-research
  use-benchmark:
    kicker: In Vorbereitung
    title: Segment-Benchmark
    lead: Vergleich mehrerer Websites in einer Branche, Region oder Marktauswahl. Diese Ebene liegt über einzelnen Reports.
    items:
    - - Enthält
      - Score-Vergleich, wiederkehrende Muster, Unterschiede zwischen Marktteilnehmern und Segmentsignale.
    - - Geeignet für
      - Marktüberblick, interne Entscheidungen, Vertriebsselektion oder Strategievorbereitung.
    - - Output
      - Benchmark-Karte und Zusammenfassung der wichtigsten Erkenntnisse.
    cta: Benchmark anfragen
    inquiry: benchmark
ci:
  url: /de/finanzanalyse-unternehmen/
  eyebrow: Company Intelligence · Pilotbetrieb
  h1: Finanzanalyse tschechischer Unternehmen aus Jahresabschlüssen
  lead: SIGEL Company Intelligence macht aus den veröffentlichten Jahresabschlüssen eines tschechischen Unternehmens einen übersichtlichen Finanzreport. Ohne manuelles Abtippen von Bilanzen und ohne Zahlensuche
    in gescannten PDFs.
  cta_hero: Analyse unverbindlich anfragen
  use_anchor: einsatz
  how_anchor: ablauf
  form_anchor: anfrage
  use_tag: Wann es sich lohnt
  use_h2:
  - Die Zahlen sind öffentlich.
  - Lesbar sind sie meist nicht.
  use_lead: Tschechische Unternehmen hinterlegen ihre Jahresabschlüsse in der öffentlichen Urkundensammlung (Sbírka listin), oft als Scans auf Tschechisch. Bis daraus eine brauchbare Übersicht entsteht,
    vergehen Stunden manueller Arbeit. Company Intelligence erledigt das automatisch.
  cards:
  - - Finanzierung
    - Bankgespräche
    - Ein übersichtlicher Finanzreport Ihres tschechischen Unternehmens als Grundlage für einen Kreditantrag oder ein Bankgespräch.
  - - Risiko
    - Partnerprüfung
    - Ein schneller Blick auf die Finanzen eines tschechischen Kunden, Lieferanten oder Wettbewerbers, bevor Sie unterschreiben.
  - - Investition
    - Übernahmen und Investitionen
    - Ein finanzielles Ausgangsbild vor einer tieferen Due Diligence, einer Investitionsentscheidung oder einem Angebot.
  how_tag: So funktioniert es
  how_h2:
  - Von der Unternehmens-ID
  - zum Finanzreport.
  steps:
  - - Unternehmens-ID
    - Sie nennen das Unternehmen. Grundlage sind seine Jahresabschlüsse (Bilanz sowie Gewinn- und Verlustrechnung).
  - - Datenextraktion
    - Das System liest Zahlen auch aus gescannten PDFs per OCR aus und prüft sie gegen die Struktur des Abschlusses.
  - - Finanzmodell
    - Daten aus verschiedenen Jahren und Formaten werden in ein einheitliches Modell überführt, aus dem Entwicklung und Kennzahlen berechnet werden.
  - - Report
    - Ergebnis ist ein übersichtlicher Report (auf Tschechisch) als Grundlage für die Bank oder interne Entscheidungen.
