modal:
  problem-leads:
    kicker: What it solves
    title: Too few enquiries from the website
    lead: A website can be technically fine and still fail to persuade. SIGEL looks for places where visitors lose clarity, trust or the next step.
    items:
    - - When it helps
      - When the site has traffic but few enquiries, orders or meaningful actions.
    - - What is checked
      - Offer clarity, CTA, trust, mobile path and communication barriers.
    - - Typical output
      - Priorities separating cosmetic changes from things with real impact.
    cta: Get the Web Intelligence report for €199
  problem-marketing:
    kicker: What it solves
    title: Marketing is running, results are weak
    lead: Before raising ad spend, it is worth checking whether the landing website can actually support a decision.
    items:
    - - When it helps
      - Before advertising, during weak conversion or when campaigns send traffic without results.
    - - What is checked
      - Landing sections, speed, CTA, proof, trust and mismatch between ads and the website.
    - - Typical output
      - A list of barriers that may block performance before the campaign itself.
    cta: Check the website before advertising
  problem-redesign:
    kicker: What it solves
    title: Redesign without a clear brief
    lead: A redesign without diagnostics often only changes visuals. SIGEL helps define what the new website should actually fix.
    items:
    - - When it helps
      - Before a redesign, agency brief or decision on what to change.
    - - What is checked
      - Structure, offer communication, trust, UX, brand archetype and decision path.
    - - Typical output
      - A redesign input focused on function, not decoration.
    cta: Get redesign input
  problem-offer:
    kicker: What it solves
    title: The offer is good, people do not get it
    lead: Sometimes the product is not the problem. The problem is how the value is explained.
    items:
    - - When it helps
      - When customers do not understand the value, price, difference or reason to continue.
    - - What is checked
      - Offer language, proof, brand archetype and customer motivations.
    - - Typical output
      - Recommendations for clarifying the offer for different customer types.
    cta: Clarify website communication
  problem-strategy:
    kicker: What it solves
    title: The website no longer matches the business
    lead: Websites often stay in the past while the company moves on. SIGEL checks whether the communication, offer and target groups still fit the business direction.
    items:
    - - When it helps
      - During stagnation, changed offer, new target group or before a strategic decision.
    - - What is checked
      - Offer fit, positioning, archetype, customer segments and priority risks.
    - - Typical output
      - A roadmap of what to change first.
    cta: Check website strategy
  problem-agency:
    kicker: What it solves
    title: Fast input for a decision
    lead: Owners, marketing teams and agencies do not have to start from opinions. SIGEL provides external diagnostic input for consulting, redesign, campaigns or strategy.
    items:
    - - When it helps
      - Before consulting, recommendations, campaigns, redesign or the next budget decision.
    - - What is checked
      - Tech, UX, communication, trust, archetypes and priorities in one input.
    - - Typical output
      - A fast report usable as internal decision support or client-facing input.
    cta: Discuss pilot cooperation
    inquiry: agency
  system-process:
    kicker: Analytical core
    title: How SIGEL builds the Web Intelligence output
    lead: SIGEL Web Intelligence is not pure AI text or a generic checklist. It is an analytical system that collects website signals, evaluates them through its own scoring, rules, weights and UX heuristics,
      and turns them into a business-ready report.
    items:
    - - Signal collection
      - Technical, SEO, structure, content, CTA, trust and offer communication signals.
    - - Own analytical logic
      - The system works with rules, weights, priorities and scoring so it is clear what has real impact.
    - - UX and communication heuristics
      - The system checks where visitors understand the offer, hesitate, lose trust or fail to find the next step.
    - - Interpretation layer
      - The data is interpreted through brand, customer archetypes and communication patterns.
    - - Human review of the output
      - Every report is personally reviewed before delivery so it has clear priorities and practical value.
    cta: Get the Web Intelligence report for €199
  use-web-audit:
    kicker: Available
    title: Web Intelligence Report
    lead: 'The core SIGEL product: business intelligence for one specific website before advertising, redesign or a business decision.'
    items:
    - - Includes
      - Desktop and mobile Lighthouse metrics, Core Web Vitals, links and CTA, accessibility, offer communication, AI readiness, an archetype playbook, roadmap and evidence data.
    - - Useful for
      - Companies, freelancers, small teams or projects needing clear diagnostic input.
    - - Output
      - A visual PDF report with priorities and recommendations.
    cta: Get the Web Intelligence report
  use-agency:
    kicker: Pilot
    title: Agency input
    lead: 'The same diagnostic base packaged for agency use: client consultation, redesign, SEO or content strategy.'
    items:
    - - Includes
      - External view of the client website, priorities and input for recommendations.
    - - Useful for
      - Agencies that want a faster starting point without full manual diagnostics from zero.
    - - Output
      - Report or internal input by agreement.
    cta: Discuss pilot cooperation
    inquiry: agency
  use-lead-research:
    kicker: Pilot
    title: Lead Research
    lead: A research layer for finding relevant company websites and public contacts in a segment, location or custom market selection.
    items:
    - - Includes
      - URL collection, filtering, basic validation and contact preparation for B2B research.
    - - Useful for
      - Sales preparation, market segmentation, prospect lists or follow-up analysis.
    - - Output
      - Structured list of websites and contacts based on the brief.
    cta: Discuss segment selection
    inquiry: lead-research
  use-benchmark:
    kicker: In preparation
    title: Segment benchmark
    lead: Comparison of multiple websites in one industry, location or market selection. This is a layer above individual reports.
    items:
    - - Includes
      - Score comparison, recurring patterns, differences between players and segment signals.
    - - Useful for
      - Market overview, internal decision-making, sales selection or strategy preparation.
    - - Output
      - Benchmark map and a summary of key findings.
    cta: Ask about benchmark
    inquiry: benchmark
ci:
  url: /en/company-financial-analysis/
  eyebrow: Company Intelligence · pilot
  h1: Financial analysis of Czech companies from their annual accounts
  lead: SIGEL Company Intelligence turns the published financial statements of a Czech company into one clear financial report. No manual retyping of statements and no hunting for numbers in scanned PDFs.
  cta_hero: Request an analysis
  use_anchor: use-cases
  how_anchor: how-it-works
  form_anchor: inquiry
  use_tag: When it helps
  use_h2:
  - The numbers are public.
  - Readable they are not.
  use_lead: Czech companies file their financial statements in the public Collection of Documents (Sbírka listin), often as scans in Czech. Turning them into a usable overview takes hours of manual work.
    Company Intelligence does that work automatically.
  cards:
  - - Financing
    - Bank discussions
    - A clear financial report of your Czech company as supporting material for a loan application or bank meeting.
  - - Risk
    - Partner check
    - A quick look at the finances of a Czech customer, supplier or competitor before you sign a contract.
  - - Investment
    - Acquisitions and investment
    - A baseline financial picture of a Czech company before deeper due diligence, an investment decision or an offer.
  how_tag: How it works
  how_h2:
  - From company ID
  - to a financial report.
  steps:
  - - Company ID
    - You name the company. The input is its annual accounts (balance sheet and profit and loss statement).
  - - Data extraction
    - The system extracts figures even from scanned PDFs using OCR and checks them against the statement structure.
  - - Financial model
    - Data from different years and formats is converted into one consistent model used to calculate trends and ratios.
  - - Report
    - The output is a clear report (in Czech), ready as material for a bank or an internal decision.
  form:
    tag: Pilot · Czech companies
    h2: Need an analysis of a specific company?
    lead: Company Intelligence is in pilot operation for Czech companies. Send us the company ID (IČO) and what you need the analysis for. We will get back to you with timing and price. The inquiry is non-binding.
