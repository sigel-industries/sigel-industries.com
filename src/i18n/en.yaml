home_areas:
  h2:
  - 'Eleven areas. One answer:'
  - what deserves to be
  - fixed first.
  aria: Eleven audit areas
  chip: HTTPS, TLS and security headers
  items:
  - - Performance
    - cold
    - 'Lighthouse for desktop and mobile and Core Web Vitals: LCP, FCP, CLS, TBT, Speed Index, TTI.'
  - - Indexing and SEO
    - cold
    - Robots.txt, sitemap, canonical, metadata, headings and Open Graph.
  - - Links and CTA
    - cold
    - Broken and blocked links, calls to action and suspicious elements.
  - - Accessibility
    - cold
    - Contrast, font size and touch targets with concrete elements on desktop and mobile.
  - - Security signals
    - cold
    - HTTPS and redirects, TLS certificate and HTTP security headers. Passive check.
  - - UX and mobile usability
    - warm
    - Viewport, navigation, content orientation and the visitor’s mobile journey.
  - - Offer communication
    - warm
    - What the website offers, to whom, how clearly and concretely, and where trust is lost.
  - - AI readiness
    - warm
    - Structured data and signals for AI search.
  - - Brand and audience archetype
    - warm
    - Archetype map, brand and customer playbook, tone-of-voice rules.
  - - Business impact and roadmap
    - warm
    - Executive summary, impact × effort and an action plan of what to fix first.
  - - Evidence appendix
    - warm
    - Crawl, robots, sitemap, metadata and measured data to verify every finding.
