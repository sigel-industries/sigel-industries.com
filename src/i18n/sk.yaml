modal:
  problem-leads:
    kicker: Čo to rieši
    title: Málo dopytov z webu
    lead: Web môže byť technicky v poriadku a napriek tomu nepresviedčať. SIGEL hľadá miesta, kde návštevník stráca jasnosť, dôveru alebo ďalší krok.
    items:
    - - Kedy pomáha
      - Keď má web návštevnosť, ale málo dopytov, objednávok alebo zmysluplných akcií.
    - - Čo sa kontroluje
      - Jasnosť ponuky, CTA, dôvera, mobilná cesta a komunikačné bariéry.
    - - Typický výstup
      - Priority oddeľujúce kozmetiku od vecí s reálnym dopadom.
    cta: Získať Web Intelligence report za 199 €
  problem-marketing:
    kicker: Čo to rieši
    title: Marketing beží, výsledky sú slabé
    lead: Pred zvýšením rozpočtu sa oplatí overiť, či vstupný web vôbec dokáže podporiť rozhodnutie.
    items:
    - - Kedy pomáha
      - Pred reklamou, pri slabej konverzii alebo keď kampane posielajú návštevnosť bez výsledku.
    - - Čo sa kontroluje
      - Landing sekcie, rýchlosť, CTA, dôkazy, dôvera a nesúlad medzi reklamou a webom.
    - - Typický výstup
      - Zoznam bariér, ktoré môžu brzdiť výkon ešte pred samotnou kampaňou.
    cta: Overiť web pred reklamou
  problem-redesign:
    kicker: Čo to rieši
    title: Redizajn bez jasného zadania
    lead: Redizajn bez diagnostiky často zmení iba vzhľad. SIGEL pomôže určiť, čo má nový web skutočne opraviť.
    items:
    - - Kedy pomáha
      - Pred redizajnom, zadaním pre agentúru alebo rozhodnutím, čo na webe meniť.
    - - Čo sa kontroluje
      - Štruktúra, komunikácia ponuky, dôvera, UX, archetyp značky a rozhodovacia cesta.
    - - Typický výstup
      - Podklad pre redizajn zameraný na funkciu, nie dekoráciu.
    cta: Získať podklad pre redizajn
  problem-offer:
    kicker: Čo to rieši
    title: Ponuka je dobrá, ľudia jej nerozumejú
    lead: Niekedy nie je problém produkt, ale spôsob, akým sa vysvetľuje jeho hodnota.
    items:
    - - Kedy pomáha
      - Keď zákazníci nerozumejú hodnote, cene, rozdielu alebo dôvodu pokračovať.
    - - Čo sa kontroluje
      - Jazyk ponuky, dôkazy, archetyp značky a zákaznícke motivácie.
    - - Typický výstup
      - Odporúčania na spresnenie ponuky pre rôzne typy zákazníkov.
    cta: Spresniť komunikáciu webu
  problem-strategy:
    kicker: Čo to rieši
    title: Web už nezodpovedá firme
    lead: Web často zostane v minulosti, aj keď sa firma posunula. SIGEL overí, či komunikácia, ponuka a cieľové skupiny stále zodpovedajú realite biznisu.
    items:
    - - Kedy pomáha
      - Pri stagnácii, zmene ponuky, novej cieľovke alebo pred zásadnejším obchodným rozhodnutím.
    - - Čo sa kontroluje
      - Súlad ponuky, positioning, archetyp, zákaznícke segmenty a prioritné riziká.
    - - Typický výstup
      - Roadmapa toho, čo zmeniť ako prvé, aby web znovu podporoval smer firmy.
    cta: Overiť stratégiu webu
  problem-agency:
    kicker: Čo to rieši
    title: Rýchly podklad pre rozhodnutie
    lead: Majiteľ, marketingový tím ani agentúra nemusia začínať od dojmov. SIGEL dodá externú diagnostiku ako vstup do konzultácie, redizajnu, kampane alebo stratégie.
    items:
    - - Kedy pomáha
      - Pred konzultáciou, návrhom úprav, kampaňou, redizajnom alebo rozhodnutím o ďalšom rozpočte.
    - - Čo sa kontroluje
      - Technika, UX, komunikácia, dôvera, archetypy a priority v jednom podklade.
    - - Typický výstup
      - Rýchly report použiteľný ako interný rozhodovací alebo klientsky podklad.
    cta: Dohodnúť podmienky spolupráce
    inquiry: agency
  system-process:
    kicker: Analytické jadro
    title: Ako SIGEL skladá Web Intelligence výstup
    lead: SIGEL Web Intelligence nie je čistý AI text ani bežný checklist. Je to analytický systém, ktorý zbiera signály z webu, vyhodnocuje ich vlastným scoringom, pravidlami, váhami a UX heuristikami
      a prevádza ich do obchodne použiteľného reportu.
    items:
    - - Zber signálov
      - Technika, SEO, štruktúra, obsah, CTA, dôvera a komunikácia ponuky.
    - - Vlastná analytická logika
      - Systém pracuje s pravidlami, váhami, prioritami a scoringom, aby bolo jasné, čo má reálny dopad.
    - - UX a komunikačné heuristiky
      - Systém sleduje, kde návštevník chápe ponuku, kde váha a kde môže strácať dôveru.
    - - Interpretačná vrstva
      - Nad dátami vzniká interpretácia značky, zákazníckych archetypov a komunikácie pre rôzne typy zákazníkov.
    - - Ručná kontrola výstupu
      - Každý report pred odoslaním prechádza osobnou kontrolou, aby mal jasné priority a praktický zmysel.
    cta: Získať Web Intelligence report za 199 €
  use-web-audit:
    kicker: Dostupné
    title: Web Intelligence Report
    lead: 'Základný produkt SIGEL: business intelligence pre jeden konkrétny web pred reklamou, redizajnom alebo obchodným rozhodnutím.'
    items:
    - - Obsahuje
      - Desktopové a mobilné Lighthouse metriky, Core Web Vitals, odkazy a CTA, prístupnosť, komunikáciu ponuky, AI pripravenosť, archetypový playbook, roadmapu a evidence dáta.
    - - Hodí sa pre
      - Firmy, freelancerov, menšie tímy alebo projekty, ktoré potrebujú jasný diagnostický vstup.
    - - Výstup
      - Vizuálny PDF report s prioritami a odporúčaniami.
    cta: Získať Web Intelligence report
  use-agency:
    kicker: Dostupné
    title: Agentúrny podklad
    lead: 'Rovnaký Web Intelligence report pre weby vašich klientov: klientská konzultácia, redizajn, SEO alebo obsahová stratégia.'
    items:
    - - Obsahuje
      - Externý pohľad na klientsky web, priority a podklad pre odporúčanie.
    - - Hodí sa pre
      - Agentúry, ktoré chcú rýchlejší vstup bez kompletnej ručnej diagnostiky od nuly.
    - - Výstup
      - Report alebo interný podklad podľa dohody.
    cta: Dohodnúť podmienky spolupráce
    inquiry: agency
  use-lead-research:
    kicker: Pilotne
    title: Lead Research
    lead: 'Výskumná vrstva: hľadanie relevantných firemných webov a verejných kontaktov v segmente, lokalite alebo vlastnom výbere trhu.'
    items:
    - - Obsahuje
      - Zber URL, filtrovanie, základnú validáciu a prípravu kontaktov pre B2B výskum.
    - - Hodí sa pre
      - Obchodnú prípravu, segmentáciu trhu, zoznam potenciálnych klientov alebo nadväzujúcu analýzu.
    - - Výstup
      - Štruktúrovaný zoznam webov a kontaktov podľa zadania.
    cta: Prebrať výber segmentu
    inquiry: lead-research
  use-benchmark:
    kicker: Pripravujeme
    title: Segmentový benchmark
    lead: Porovnanie viacerých webov v jednom odvetví, lokalite alebo výbere trhu. Ide o nadväzujúcu vrstvu nad jednotlivými reportmi.
    items:
    - - Obsahuje
      - Porovnanie skóre, opakujúce sa vzorce, rozdiely medzi hráčmi a segmentové signály.
    - - Hodí sa pre
      - Prehľad trhu, interné rozhodovanie, obchodný výber alebo prípravu stratégie.
    - - Výstup
      - Benchmarková mapa a súhrn hlavných zistení.
    cta: Opýtať sa na benchmark
    inquiry: benchmark
